<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Raptorjesus - EventColorTracker</title>
    <style>
        :root {
            --bg-main: #0F1115;
            --bg-card: #181B22;
            --bg-card-alt: #1F232D;
            --border-color: #2A2F3D;
            --text-primary: #F0F2F5;
            --text-secondary: #8C96A6;
            --accent-yellow: #FFB000;
            --accent-red: #FF4D4D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 100vh;
        }

        header {
            background: var(--bg-main);
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-yellow);
            flex-shrink: 0;
        }

        h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--text-primary);
        }

        .stats-badge {
            font-size: 0.75rem;
            background: var(--bg-card-alt);
            padding: 4px 8px;
            border-radius: 12px;
            color: var(--accent-yellow);
            border: 1px solid rgba(255, 176, 0, 0.2);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .search-container {
            position: relative;
        }

        input[type="text"] {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus {
            border-color: var(--accent-yellow);
        }

        .dino-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 150;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .dino-suggestion-item {
            padding: 10px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .dino-suggestion-item:hover, .dino-suggestion-item.active {
            background: var(--bg-card-alt);
            color: var(--accent-yellow);
        }

        .event-chips-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 8px;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .event-chip {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .event-chip.active {
            background: rgba(255, 176, 0, 0.15);
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
        }

        .btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent-yellow);
            color: #000;
            border: none;
        }

        .btn-danger {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.3);
            color: var(--accent-red);
        }

        .progress-bar-container {
            height: 4px;
            background: var(--bg-card-alt);
            width: 100%;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-yellow);
            width: 0%;
            transition: width 0.3s ease;
        }

        .list-container {
            padding: 0 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .color-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .color-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .color-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .id-badge {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .color-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .region-btn {
            height: 38px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card-alt);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .region-btn.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            background: transparent;
            border-style: dashed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .checkbox-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .checkbox-btn.active {
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
            background: rgba(255,176,0,0.1);
        }

        .dino-list-preview {
            max-height: 120px;
            overflow-y: auto;
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dino-item {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
        }

        .dino-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .backup-footer {
            margin: 20px 16px 0 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            justify-content: center;
        }
    </style>
</head>

            <div>
                <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">Select Active Regions:</label>
                <div class="checkbox-group" id="modalRegionGroup">
                    <div class="checkbox-btn active" data-region="0" onclick="toggleRegionSelect(this, 0)">R0</div>
                    <div class="checkbox-btn active" data-region="1" onclick="toggleRegionSelect(this, 1)">R1</div>
                    <div class="checkbox-btn active" data-region="2" onclick="toggleRegionSelect(this, 2)">R2</div>
                    <div class="checkbox-btn active" data-region="3" onclick="toggleRegionSelect(this, 3)">R3</div>
                    <div class="checkbox-btn active" data-region="4" onclick="toggleRegionSelect(this, 4)">R4</div>
                    <div class="checkbox-btn active" data-region="5" onclick="toggleRegionSelect(this, 5)">R5</div>
                </div>
            </div>

            <button class="btn btn-primary" id="saveDinoBtn" onclick="saveDino()">Save Preset</button>
            <button class="btn" id="cancelEditBtn" onclick="resetModalForm()" style="display:none; background:transparent;">Cancel Edit</button>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">

            <div>
                <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; display: block;">Saved Dinos (<span id="savedCount">0</span>):</label>
                <div class="dino-list-preview" id="modalDinoList"></div>
            </div>

            <button class="btn" onclick="closeModal()">Close</button>
        </div>
    </div>

        // Da das hochgeladene Bild dynamisch eingebunden wird, nutzen wir die Rohdaten oder laden den Pfad:
        // Wir setzen das Bild direkt via JavaScript, um Encoding-Probleme zu umgehen:
        window.addEventListener('DOMContentLoaded', () => {
            const imgEl = document.getElementById('logoImg');
            // Canvas/Image Data URL aus dem Input-Image
            // Da das Bild direkt im Kontext vorliegt, binden wir einen direkten Platzhalter ein, der das Logo lädt:
            const canvas = document.createElement('canvas');
            const img = new Image();
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                imgEl.src = canvas.toDataURL('image/jpeg');
            };
            // Wir nutzen hier den lokalen Pfad/Objekt-Verweis falls als Datei hochgeladen oder betten den direkten Data-String ein
            // Um es narrensicher in der index.html zu haben, laden wir das Originalbild als base64:
        });
    </script>

        function getTextColor(hex) {
            const r = parseInt(hex.substring(1,3), 16);
            const g = parseInt(hex.substring(3,5), 16);
            const b = parseInt(hex.substring(5,7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 140 ? "#000000" : "#FFFFFF";
        }

        function getActiveState() {
            const key = selectedDino ? `dino_${selectedDino}` : `general_all`;
            if (!state[key]) state[key] = {};
            return state[key];
        }

        function exportData() {
            const data = {
                states: JSON.parse(localStorage.getItem('ark_tracker_states') || '{}'),
                dinos: JSON.parse(localStorage.getItem('ark_tracker_dinos') || '[]'),
                eventFilters: JSON.parse(localStorage.getItem('ark_event_filters') || '[]')
            };
            const jsonStr = JSON.stringify(data);
            navigator.clipboard.writeText(jsonStr).then(() => {
                alert("Backup copied to clipboard! Open your Homescreen app and click 'Import Data'.");
            }).catch(() => {
                prompt("Copy this code manually:", jsonStr);
            });
        }

        function importData() {
            const jsonStr = prompt("Paste your exported backup code here:");
            if (!jsonStr) return;
            try {
                const data = JSON.parse(jsonStr);
                if (data.states) localStorage.setItem('ark_tracker_states', JSON.stringify(data.states));
                if (data.dinos) localStorage.setItem('ark_tracker_dinos', JSON.stringify(data.dinos));
                if (data.eventFilters) localStorage.setItem('ark_event_filters', JSON.stringify(data.eventFilters));
                
                state = data.states || {};
                dinos = data.dinos || [];
                eventFilters = data.eventFilters || [];

                renderEventChips();
                renderList();
                alert("Data imported successfully!");
            } catch(e) {
                alert("Invalid backup code!");
            }
        }

        function renderEventChips() {
            const container = document.getElementById('eventChipsContainer');
            if (eventFilters.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            
            let html = `<div class="event-chip ${activeEventFilterIds === null ? 'active' : ''}" onclick="applyEventFilter(null)">All Colors</div>`;
            
            eventFilters.forEach((ef, index) => {
                const isActive = activeEventFilterIds === ef.ids;
                html += `
                    <div class="event-chip ${isActive ? 'active' : ''}">
                        <span onclick="applyEventFilter('${ef.ids}')">⭐ ${ef.name}</span>
                        <span style="opacity: 0.5; margin-left: 4px; cursor: pointer;" onclick="deleteEventFilter(${index})">✕</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function applyEventFilter(idString) {
            activeEventFilterIds = idString;
            if (idString) {
                document.getElementById('searchInput').value = idString;
            } else {
                document.getElementById('searchInput').value = '';
            }
            renderEventChips();
            renderList();
        }

        function saveCurrentFilter() {
            const val = document.getElementById('searchInput').value.trim();
            if (!val) return alert("Please enter comma-separated IDs first (e.g. 1,2,5,10)");
            
            const name = prompt("Name for this Event Filter (e.g. Easter Event, Summer Bash):");
            if (!name) return;

            eventFilters.push({ name: name, ids: val });
            localStorage.setItem('ark_event_filters', JSON.stringify(eventFilters));
            activeEventFilterIds = val;
            renderEventChips();
            renderList();
        }

        function deleteEventFilter(index) {
            eventFilters.splice(index, 1);
            localStorage.setItem('ark_event_filters', JSON.stringify(eventFilters));
            renderEventChips();
        }

        function renderList() {
            const listEl = document.getElementById('colorList');
            const searchRaw = document.getElementById('searchInput').value.trim().toLowerCase();
            listEl.innerHTML = '';

            const saveBtn = document.getElementById('saveEventBtn');
            if (searchRaw.includes(',') && /\d/.test(searchRaw)) {
                saveBtn.style.display = "flex";
            } else {
                saveBtn.style.display = "none";
            }

            let allowedIds = null;
            if (searchRaw.includes(',')) {
                allowedIds = searchRaw.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            }

            const currentDino = dinos.find(d => d.name === selectedDino);
            const activeRegions = currentDino ? currentDino.regions : [0,1,2,3,4,5];
            const dinoState = getActiveState();

            let checkedCount = 0;
            let totalAvailable = 0;

            arkColors.forEach(c => {
                if (allowedIds !== null) {
                    if (!allowedIds.includes(c.id)) return;
                } else if (searchRaw) {
                    if (!c.id.toString().includes(searchRaw) && !c.name.toLowerCase().includes(searchRaw)) {
                        return;
                    }
                }

                const card = document.createElement('div');
                card.className = 'color-card';

                let regionsHtml = '';
                for (let r = 0; r < 6; r++) {
                    const key = `${c.id}_${r}`;
                    const isChecked = !!dinoState[key];
                    const isActive = activeRegions.includes(r);

                    if (isActive) totalAvailable++;
                    if (isChecked && isActive) checkedCount++;

                    if (!isActive) {
                        regionsHtml += `<div class="region-btn disabled">R${r}</div>`;
                    } else {
                        const style = isChecked 
                            ? `background-color: ${c.hex}; color: ${getTextColor(c.hex)}; border-color: ${c.hex}; box-shadow: 0 0 8px ${c.hex}66;` 
                            : '';
                        regionsHtml += `<div class="region-btn" style="${style}" onclick="toggleRegion(${c.id}, ${r})">R${r}</div>`;
                    }
                }

                card.innerHTML = `
                    <div class="color-header">
                        <div class="color-left">
                            <span class="id-badge">ID ${c.id}</span>
                            <div class="color-dot" style="background:${c.hex}"></div>
                            <div class="color-name">${c.name}</div>
                        </div>
                    </div>
                    <div class="regions-grid">${regionsHtml}</div>
                `;

                listEl.appendChild(card);
            });

            document.getElementById('statsBadge').innerText = `${checkedCount} / ${totalAvailable}`;
            const pct = totalAvailable > 0 ? (checkedCount / totalAvailable) * 100 : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function toggleRegion(id, r) {
            const dinoState = getActiveState();
            const key = `${id}_${r}`;
            dinoState[key] = !dinoState[key];
            
            localStorage.setItem('ark_tracker_states', JSON.stringify(state));
            renderList();
        }

        function onDinoSearchInput() {
            const input = document.getElementById('dinoSearchInput');
            const val = input.value.toLowerCase().trim();
            const suggestionsEl = document.getElementById('dinoSuggestions');

            if (!val) {
                selectedDino = null;
                document.getElementById('deleteDinoBtn').style.display = "none";
                renderList();
            }

            const matches = dinos.filter(d => d.name.toLowerCase().startsWith(val));

            let html = `<div class="dino-suggestion-item" onclick="selectDino(null)">🌐 All Regions (R0-R5)</div>`;
            
            if (matches.length > 0 && val !== "") {
                html += matches.map(d => `
                    <div class="dino-suggestion-item" onclick="selectDino('${d.name}')">
                        🦕 ${d.name} <span style="font-size:0.7rem; color:var(--text-secondary);">(R${d.regions.join(', R')})</span>
                    </div>
                `).join('');
                suggestionsEl.innerHTML = html;
                suggestionsEl.style.display = "block";
            } else {
                suggestionsEl.innerHTML = html + `<div style="padding: 8px; font-size: 0.75rem; color: var(--text-secondary); text-align: center;">No matching dino found</div>`;
                suggestionsEl.style.display = val ? "block" : "none";
            }
        }

        function selectDino(name) {
            selectedDino = name;
            const input = document.getElementById('dinoSearchInput');
            input.value = name ? name : "";
            document.getElementById('dinoSuggestions').style.display = "none";

            document.getElementById('deleteDinoBtn').style.display = name ? "flex" : "none";
            renderList();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('dinoSuggestions').style.display = 'none';
            }
        });

        function updateModalDinoList() {
            const previewEl = document.getElementById('modalDinoList');
            document.getElementById('savedCount').innerText = dinos.length;
            
            if (dinos.length === 0) {
                previewEl.innerHTML = '<div style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; padding: 6px;">No dinos added yet</div>';
                return;
            }

            previewEl.innerHTML = dinos.map(d => `
                <div class="dino-item">
                    <span><strong>${d.name}</strong> (R${d.regions.join(', R')})</span>
                    <div class="dino-item-actions">
                        <button style="background:none; border:none; color:var(--accent-yellow); cursor:pointer; font-size:0.85rem;" onclick="editDinoPreset('${d.name}')" title="Edit Dino">✏️</button>
                        <button style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-size:0.85rem;" onclick="removeDinoByName('${d.name}')" title="Delete Dino">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function editDinoPreset(name) {
            const d = dinos.find(x => x.name === name);
            if (!d) return;

            editingDinoOriginalName = d.name;
            document.getElementById('newDinoName').value = d.name;
            newDinoRegions = [...d.regions];

            const btns = document.querySelectorAll('#modalRegionGroup .checkbox-btn');
            btns.forEach(btn => {
                const r = parseInt(btn.getAttribute('data-region'));
                if (newDinoRegions.includes(r)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.getElementById('modalTitle').innerText = `Edit: ${d.name}`;
            document.getElementById('saveDinoBtn').innerText = "Update Preset";
            document.getElementById('cancelEditBtn').style.display = "block";
        }

        function resetModalForm() {
            editingDinoOriginalName = null;
            document.getElementById('newDinoName').value = '';
            newDinoRegions = [0, 1, 2, 3, 4, 5];

            const btns = document.querySelectorAll('#modalRegionGroup .checkbox-btn');
            btns.forEach(btn => btn.classList.add('active'));

            document.getElementById('modalTitle').innerText = "Add Dino Preset";
            document.getElementById('saveDinoBtn').innerText = "Save Preset";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        function removeDinoByName(name) {
            dinos = dinos.filter(d => d.name !== name);
            delete state[`dino_${name}`];
            localStorage.setItem('ark_tracker_dinos', JSON.stringify(dinos));
            localStorage.setItem('ark_tracker_states', JSON.stringify(state));

            if (selectedDino === name) {
                selectedDino = null;
                document.getElementById('dinoSearchInput').value = "";
                document.getElementById('deleteDinoBtn').style.display = "none";
            }
            if (editingDinoOriginalName === name) resetModalForm();
            updateModalDinoList();
            renderList();
        }

        function openModal() { 
            resetModalForm();
            updateModalDinoList();
            document.getElementById('dinoModal').style.display = 'flex'; 
        }
        
        function closeModal() { 
            resetModalForm();
            document.getElementById('dinoModal').style.display = 'none'; 
        }

        function toggleRegionSelect(el, r) {
            el.classList.toggle('active');
            if (newDinoRegions.includes(r)) {
                newDinoRegions = newDinoRegions.filter(x => x !== r);
            } else {
                newDinoRegions.push(r);
            }
        }

        function saveDino() {
            const name = document.getElementById('newDinoName').value.trim();
            if (!name) return alert("Please enter a name!");
            
            const sortedRegions = [...newDinoRegions].sort();

            if (editingDinoOriginalName) {
                const targetDino = dinos.find(d => d.name === editingDinoOriginalName);
                if (targetDino) {
                    targetDino.name = name;
                    targetDino.regions = sortedRegions;
                }

                if (editingDinoOriginalName !== name) {
                    state[`dino_${name}`] = state[`dino_${editingDinoOriginalName}`] || {};
                    delete state[`dino_${editingDinoOriginalName}`];
                    localStorage.setItem('ark_tracker_states', JSON.stringify(state));

                    if (selectedDino === editingDinoOriginalName) {
                        selectedDino = name;
                        document.getElementById('dinoSearchInput').value = name;
                    }
                }
            } else {
                if (dinos.some(d => d.name.toLowerCase() === name.toLowerCase())) {
                    return alert("A dino with this name already exists!");
                }
                dinos.push({ name, regions: sortedRegions });
                selectDino(name);
            }

            localStorage.setItem('ark_tracker_dinos', JSON.stringify(dinos));
            resetModalForm();
            closeModal();
            renderList();
        }

        function deleteCurrentDino() {
            if (!selectedDino) return;
            if (confirm(`Do you really want to delete "${selectedDino}"?`)) {
                removeDinoByName(selectedDino);
            }
        }

        function resetAll() {
            const scopeText = selectedDino ? `for "${selectedDino}"` : `for All Regions`;
            if (confirm(`Really reset all checked regions ${scopeText}?`)) {
                const dinoState = getActiveState();
                for (let key in dinoState) delete dinoState[key];
                localStorage.setItem('ark_tracker_states', JSON.stringify(state));
                renderList();
            }
        }

        renderEventChips();
        renderList();
    </script>
</body>
</html>
